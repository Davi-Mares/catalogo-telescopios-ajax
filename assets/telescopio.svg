<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="ceu" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1b2550"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </radialGradient>
    <linearGradient id="tubo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2b84b"/>
      <stop offset="100%" stop-color="#c9962f"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="24" fill="url(#ceu)"/>

  <!-- estrelas -->
  <circle cx="60" cy="70" r="2" fill="#e7e9f5" opacity="0.8"/>
  <circle cx="320" cy="50" r="1.6" fill="#e7e9f5" opacity="0.7"/>
  <circle cx="270" cy="110" r="2.2" fill="#e7e9f5" opacity="0.9"/>
  <circle cx="110" cy="140" r="1.4" fill="#e7e9f5" opacity="0.6"/>
  <circle cx="340" cy="180" r="1.8" fill="#e7e9f5" opacity="0.8"/>
  <circle cx="40" cy="220" r="1.6" fill="#e7e9f5" opacity="0.6"/>
  <circle cx="200" cy="40" r="1.4" fill="#e7e9f5" opacity="0.7"/>
  <circle cx="360" cy="260" r="1.4" fill="#e7e9f5" opacity="0.6"/>

  <!-- tripé -->
  <line x1="200" y1="330" x2="150" y2="380" stroke="#4fd1c5" stroke-width="4" stroke-linecap="round"/>
  <line x1="200" y1="330" x2="200" y2="385" stroke="#4fd1c5" stroke-width="4" stroke-linecap="round"/>
  <line x1="200" y1="330" x2="250" y2="380" stroke="#4fd1c5" stroke-width="4" stroke-linecap="round"/>

  <!-- corpo do telescópio -->
  <g transform="rotate(-35 200 260)">
    <rect x="150" y="150" width="100" height="170" rx="18" fill="url(#tubo)"/>
    <rect x="150" y="150" width="100" height="26" rx="13" fill="#1b2550"/>
    <circle cx="200" cy="163" r="10" fill="#0b1020"/>
  </g>

  <!-- ocular -->
  <circle cx="200" cy="330" r="14" fill="#4fd1c5"/>
</svg>
